<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1 — same console bridge as index.html so this route
  // reports cleanly in the platform's dev preview.
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Appraise 🏆 public results</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:wght@700&family=Space+Grotesk:wght@400;700&display=swap');

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,0,200,.30), transparent 42%),
        radial-gradient(circle at 88% 22%, rgba(0,255,225,.28), transparent 42%),
        radial-gradient(circle at 25% 85%, rgba(255,230,0,.22), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(120,80,255,.30), transparent 45%),
        #0a0118;
      background-attachment: fixed;
      overflow-x: hidden;
    }
    .funky { font-family: 'Bungee', 'Comic Neue', cursive; }
    .comic { font-family: 'Comic Neue', cursive; }

    @keyframes hue { 0%{filter:hue-rotate(0)} 100%{filter:hue-rotate(360deg)} }
    .rainbow {
      background: linear-gradient(90deg,#ff3cac,#ffeb3b,#2afadf,#7c4dff,#ff3cac);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: hue 6s linear infinite, slide 8s linear infinite;
    }
    @keyframes slide { 0%{background-position:0 0} 100%{background-position:300% 0} }

    .neon-card {
      border: 3px solid;
      border-image: linear-gradient(120deg,#ff3cac,#2afadf,#ffeb3b,#7c4dff) 1;
      box-shadow: 0 0 0 2px rgba(0,0,0,.4), 8px 8px 0 rgba(255,60,172,.45);
      background: rgba(20,4,40,.78);
      backdrop-filter: blur(2px);
    }
    .tilt-1 { transform: rotate(-1.2deg); } .tilt-2 { transform: rotate(1deg); }
    .badge { font-weight:800; letter-spacing:.02em; }
  </style>
</head>
<body class="text-zinc-100 min-h-screen p-4 sm:p-6">

  <header class="max-w-3xl mx-auto mb-6 text-center select-none">
    <h1 class="funky text-4xl sm:text-5xl rainbow drop-shadow-[0_3px_0_rgba(0,0,0,.6)]">🎉 APPRAISE 🗳️</h1>
    <p class="comic text-lg text-yellow-300 mt-1 -rotate-1">public voting results — shared for all to see 🌍</p>
  </header>

  <main id="app" class="max-w-3xl mx-auto">
    <div class="text-center comic text-2xl animate-pulse">fetching the results… 🔮</div>
  </main>

  <footer class="max-w-3xl mx-auto mt-10 text-center comic text-zinc-500 text-sm">
    powered by Appraise on
    <a href="https://social-vibecoding.usernodelabs.org" class="underline text-cyan-400">Usernode Social Vibecoding</a>
    · individual ballots stay secret 🤐
  </footer>

  <script>
    const $ = (sel, root = document) => root.querySelector(sel);
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // Only http(s) URLs are rendered as links. app_url is platform-derived,
    // but this page is public and API fields are untrusted data — a
    // javascript: URI must never reach an href.
    function safeHref(u) {
      try {
        const p = new URL(u, location.origin);
        return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null;
      } catch (_) { return null; }
    }

    function statusBadge(status) {
      const map = {
        open:   ['🟢 OPEN', 'bg-emerald-400 text-emerald-950'],
        draft:  ['📝 DRAFT', 'bg-yellow-300 text-yellow-900'],
        closed: ['🔒 CLOSED', 'bg-fuchsia-400 text-fuchsia-950'],
      };
      const pair = map[status] || ['?', 'bg-zinc-400 text-black'];
      return `<span class="badge ${pair[1]} px-2.5 py-1 rounded-full text-xs">${pair[0]}</span>`;
    }

    function notFound(root) {
      root.innerHTML = `
        <div class="neon-card rounded-3xl p-8 text-center">
          <div class="funky text-2xl text-pink-300 mb-2">😶 Round not found</div>
          <div class="comic text-zinc-300">This round doesn't exist or isn't public.</div>
        </div>`;
    }

    function errorBox(root, msg) {
      root.innerHTML = `
        <div class="neon-card rounded-3xl p-8 text-center">
          <div class="funky text-2xl text-pink-300 mb-2">😬 Couldn't load the results</div>
          <div class="comic text-zinc-300">${esc(msg)} — try refreshing in a moment.</div>
        </div>`;
    }

    function renderResults(root, data) {
      const r = data.round || {};
      const res = data.results || {};
      const cands = Array.isArray(res.candidates) ? res.candidates : [];
      const max = Math.max(1, ...cands.map((c) => c.votes || 0));
      const palette = ['from-pink-500 to-yellow-400','from-cyan-400 to-emerald-400','from-purple-500 to-pink-500','from-yellow-300 to-orange-500','from-emerald-400 to-cyan-400'];
      const medals = ['🥇','🥈','🥉'];

      // A closed round's numbers are final; anything else is a live tally.
      const liveness = r.status === 'closed'
        ? `<div class="comic text-fuchsia-300 mt-1">🏁 Final results — voting is closed.</div>`
        : r.status === 'open'
          ? `<div class="comic text-emerald-300 mt-1">🔴 Live tally — voting is still open, numbers can change!</div>`
          : `<div class="comic text-yellow-300 mt-1">📝 Voting hasn't opened yet — nothing to count so far.</div>`;

      root.innerHTML = `
        <div class="neon-card rounded-3xl p-6 mb-5 tilt-2">
          <div class="flex items-start justify-between gap-3 flex-wrap">
            <div>
              <h2 class="funky text-2xl text-white">🏆 ${esc(r.title)}</h2>
              <div class="comic text-cyan-200 mt-1">🗳️ ${r.votes_per_voter} vote(s) per voter · by @${esc(r.creator_username)}</div>
              ${liveness}
            </div>
            ${statusBadge(r.status)}
          </div>
          ${r.description ? `<p class="comic text-zinc-300 mt-3">${esc(r.description)}</p>` : ''}
        </div>

        <div class="neon-card rounded-3xl p-6 tilt-1">
          <h3 class="funky text-2xl text-cyan-300 mb-1">📊 RESULTS</h3>
          <p class="comic text-zinc-300 mb-4">${res.voter_count || 0} voter(s) · ${res.total_votes || 0} vote(s) cast 🗣️</p>
          <div class="space-y-3">
            ${cands.map((c, i) => {
              const link = safeHref(c.app_url);
              return `
              <div>
                <div class="flex justify-between comic text-sm mb-1">
                  <span>${medals[i] || '▪️'} ${esc(c.app_name)}
                    ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="text-cyan-300 underline text-xs ml-1">open ↗</a>` : ''}
                  </span>
                  <span class="text-yellow-300 funky">${c.votes || 0}</span>
                </div>
                <div class="h-6 rounded-full bg-black/50 overflow-hidden border-2 border-black">
                  <div class="h-full bg-gradient-to-r ${palette[i % palette.length]} rounded-full transition-all"
                       style="width:${Math.round(((c.votes || 0) / max) * 100)}%"></div>
                </div>
              </div>`;
            }).join('')}
          </div>
          ${cands.length === 0 ? `<div class="comic text-zinc-400 text-center">No candidate apps in this round yet.</div>` : ''}
        </div>`;
    }

    (async function boot() {
      const root = $('#app');
      const m = window.location.pathname.match(/^\/results\/([^/]+)\/?$/);
      if (!m) return notFound(root);
      const slug = decodeURIComponent(m[1]);
      try {
        const res = await fetch('/api/results?round=' + encodeURIComponent(slug));
        let data = {};
        try { data = await res.json(); } catch (_) {}
        if (res.status === 404) return notFound(root);
        if (!res.ok) return errorBox(root, data.error || ('Request failed (' + res.status + ')'));
        renderResults(root, data);
      } catch (e) {
        errorBox(root, e.message || 'Network error');
      }
    })();
  </script>
</body>
</html>
